name: aidtrack
description: "Humanitarian Aid Distribution Management System."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Generate Android app icons and web icons.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/aidtrack_symbol.png"

  # White background behind the Android icon.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/aidtrack_symbol.png"
  adaptive_icon_foreground_inset: 16

  web:
    generate: true
    image_path: "assets/images/aidtrack_web_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"